<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading 3D Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .loading-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-in;
        }
        
        .spinner {
            width: 80px;
            height: 80px;
            margin: 30px auto;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .status-text {
            font-size: 1.2em;
            margin-top: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 10px;
            animation: progress 3s ease-in-out infinite;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <h1>🎨 2D to 3D Generator</h1>
        <div class="spinner"></div>
        <div class="status-text" id="statusText">Initializing model...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        let checkAttempts = 0;
        const maxAttempts = 60; // 60 seconds maximum wait time
        
        function checkGradioStatus() {
            fetch('/check-gradio-status/')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ready') {
                        document.getElementById('statusText').textContent = 'Ready! Redirecting...';
                        setTimeout(() => {
                            window.location.href = data.url;
                        }, 500);
                    } else {
                        checkAttempts++;
                        if (checkAttempts < maxAttempts) {
                            // Update status message based on time
                            if (checkAttempts < 10) {
                                document.getElementById('statusText').textContent = 'Starting server...';
                            } else if (checkAttempts < 20) {
                                document.getElementById('statusText').textContent = 'Loading AI model...';
                            } else {
                                document.getElementById('statusText').textContent = 'Almost ready...';
                            }
                            // Check again after 1 second
                            setTimeout(checkGradioStatus, 1000);
                        } else {
                            document.getElementById('statusText').textContent = 'Taking longer than expected. Please refresh the page.';
                        }
                    }
                })
                .catch(error => {
                    checkAttempts++;
                    if (checkAttempts < maxAttempts) {
                        setTimeout(checkGradioStatus, 1000);
                    }
                });
        }
        
        // Start checking after 2 seconds
        setTimeout(checkGradioStatus, 2000);
    </script>
</body>
</html>
