{% load static %}
{% include "header.html" %}

<style>
  .custom-login-card {
    max-width: 400px;
    margin: 40px auto;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(51,51,51,0.10), 0 1.5px 3px rgba(51,51,51,0.08);
    border: none;
    background: #fff;
  }
  .custom-login-card .card-header {
    background: linear-gradient(90deg, #1abb7c 0%, #20c997 100%);
    color: #fff;
    font-weight: 600;
    text-align: center;
    border-radius: 12px 12px 0 0;
    letter-spacing: 1px;
  }
  .custom-login-btn {
    background: linear-gradient(90deg, #1abb7c 0%, #20c997 100%);
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 4px;
    width: 100%;
    transition: background 0.2s;
  }
  .custom-login-btn:hover {
    background: #20c997;
    color: #212529;
  }
  .form-links-user {
    text-align: center;
    margin-top: 18px;
  }
  .form-links-user a {
    text-decoration: none;
    color: #20c997;
    font-weight: 500;
    transition: text-decoration 0.15s, color 0.2s;
  }
  .form-links-user a:hover, .form-links-user a:focus {
    text-decoration: underline;
    color: #108d67;
  }
  .register-user-link {
    display: inline-block;
    margin-top: 10px;
  }
</style>

<div class="container">
  <div class="card custom-login-card">
    <div class="card-header">
      User Login
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="user-username" class="form-label">Username</label>
          <input type="text" class="form-control" id="user-username" name="username" required>
        </div>
        <div class="mb-3">
          <label for="user-password" class="form-label">Password</label>
          <input type="password" class="form-control" id="user-password" name="password" required>
        </div>
        <button type="submit" class="custom-login-btn mt-2">Login</button>
      </form>
      <div class="form-links-user">
        <a href="#">Forgot Username/Password?</a>
        <br>
        <a href="{% url 'register_user' %}" class="register-user-link">Register as User</a>
      </div>
    </div>
  </div>
</div>

{% include "footer.html" %}
