{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Reset Password - PrintVerse</title>

    <link href="{% static 'assets/img/favicon.png' %}" rel="icon">
    <link href="{% static 'assets/img/apple-touch-icon.png' %}" rel="apple-touch-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">

    <style>
        /* Exact Professional Layout from Login */
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; display: flex; align-items: center; padding: 60px 0; }
        .login-card { border: none; border-radius: 12px; background: #ffffff; box-shadow: 0 5px 30px rgba(0, 0, 0, 0.05); overflow: hidden; }
        .login-header { margin-bottom: 25px; text-align: center; }
        .login-header h3 { font-weight: 800; color: #2b2320; font-family: 'Lato', sans-serif; }
        .form-control { padding: 12px 15px; border-radius: 6px; border: 1px solid #dee2e6; background-color: #f8f9fa; font-size: 0.95rem; }
        .form-control:focus { background-color: #fff; border-color: #f03c02; box-shadow: 0 0 0 0.2rem rgba(240, 60, 2, 0.15); }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        .btn-brand { background-color: #f03c02; color: white; font-weight: 600; padding: 12px; border-radius: 6px; border: none; width: 100%; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.9rem; }
        .btn-brand:hover { background-color: #d63500; color: white; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(240, 60, 2, 0.2); }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #666; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link a:hover { color: #f03c02; }
    </style>
</head>

<body class="index-page">

<header id="header" class="header sticky-top">
    <div class="branding d-flex align-items-center">
        <div class="container position-relative d-flex align-items-center justify-content-between">
            <a href="{% url 'home' %}" class="logo d-flex align-items-center">
                <h1 class="sitename">PrintVerse</h1>
            </a>
        </div>
    </div>
</header>

<main class="main">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7"> <div class="login-card p-4 p-md-5">

                    <div class="login-header">
                        <h3>Reset Password</h3>
                        <p class="text-muted small">Verify your identity to set a new password</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" action="{% url 'forgot_password' %}">
                        {% csrf_token %}

                        <div class="row mb-3">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" name="username" placeholder="Enter your username" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Registered Email</label>
                                <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <hr class="my-4 text-muted opacity-25">

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" name="new_password" placeholder="New secure password" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" placeholder="Repeat password" required>
                        </div>

                        <button type="submit" class="btn-brand">Update Password</button>
                    </form>

                    <div class="back-link">
                        <a href="{% url 'login' %}"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

{% include 'footer.html' %}
<script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
