{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Submit Feedback - PrintVerse</title>
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">
  <style>
    body { background-color: #f4f6f8; }
    .form-card { background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 40px; max-width: 600px; margin: 60px auto; }
    .btn-brand { background-color: #f03c02; color: white; border: none; font-weight: 600; }
    .btn-brand:hover { background-color: #d63500; color: white; }
  </style>
</head>
<body>

  <header id="header" class="header sticky-top bg-white shadow-sm">
    <div class="container d-flex align-items-center justify-content-between p-3">
        <h3 class="fw-bold m-0" style="color: #2b2320;">PrintVerse</h3>
        <a href="{% url 'user_home' %}" class="btn btn-outline-dark btn-sm">Back to Dashboard</a>
    </div>
  </header>

  <main class="container">
      <div class="form-card">
          <h4 class="fw-bold text-center mb-4">Rate Your Experience</h4>

          <form method="POST" action="{% url 'submit_user_feedback' %}">
              {% csrf_token %}

              <div class="mb-3">
                  <label class="form-label fw-bold small text-muted">WHO ARE YOU REVIEWING?</label>
                  <select name="feedback_target" class="form-select" required>
                      <option value="platform" selected>PrintVerse Platform (General)</option>
                      <option disabled>──────────</option>
                      {% for shop in shops %}
                        <option value="{{ shop.id }}">Shop: {{ shop.shop_name }}</option>
                      {% endfor %}
                  </select>
              </div>

              <div class="mb-3">
                  <label class="form-label fw-bold small text-muted">RATING</label>
                  <select name="rating" class="form-select">
                      <option value="5">★★★★★ - Excellent</option>
                      <option value="4">★★★★☆ - Good</option>
                      <option value="3">★★★☆☆ - Average</option>
                      <option value="2">★★☆☆☆ - Poor</option>
                      <option value="1">★☆☆☆☆ - Very Poor</option>
                  </select>
              </div>

              <div class="mb-4">
                  <label class="form-label fw-bold small text-muted">COMMENT</label>
                  <textarea name="description" class="form-control" rows="4" placeholder="Share your thoughts..." required></textarea>
              </div>

              <div class="d-grid">
                  <button type="submit" class="btn btn-brand py-2">Submit Review</button>
              </div>
          </form>
      </div>
  </main>

  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
